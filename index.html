<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ชั้นหนังสือ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ชั้นหนังสือของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a library shelf. Stats strip on top, filter bar, then a grid of covers standing on the shelf; one dialog edits a book. */
:root {
  --paper: #f5f6f2;
  --surface: #ffffff;
  --ink: #1d2420;
  --muted: #5f6b64;
  --line: #d9ded8;
  --accent: #1f5c46;      /* bottle-green library binding */
  --accent-ink: #ffffff;
  --accent-soft: #e2ece6;
  --star: #c48a12;
  --danger: #a3372b;
  --shadow: 0 1px 2px rgba(20,30,25,.08), 0 6px 16px rgba(20,30,25,.08);
  --font-display: "Noto Serif Thai", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121814; --surface: #1a221d; --ink: #e6ece7; --muted: #9aa8a0; --line: #2c3731;
    --accent: #6fbf9a; --accent-ink: #0d1a14; --accent-soft: #213229; --star: #e6b043; --danger: #e07a6c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121814; --surface: #1a221d; --ink: #e6ece7; --muted: #9aa8a0; --line: #2c3731;
  --accent: #6fbf9a; --accent-ink: #0d1a14; --accent-soft: #213229; --star: #e6b043; --danger: #e07a6c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 720px) { .wrap { padding-inline: 32px; } }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stat { padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat .v small { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid transparent; background: none; border-radius: 999px; padding: 5px 12px; color: var(--muted); font-size: 14px; }
.tab[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--line); font-weight: 500; }
.tab .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
.toolbar .grow { flex: 1 1 180px; min-width: 0; }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 16px; }
select.field { width: auto; }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; }
@media (max-width: 420px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; } }
.book { display: flex; flex-direction: column; gap: 8px; text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.cover { position: relative; width: 100%; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: var(--shadow); transition: transform .15s ease; }
.book:hover .cover { transform: translateY(-3px); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 7px; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.08) 60%, transparent); z-index: 1; }
.gen { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 12px 14px 18px; color: #f6f3ea; }
.gen .t { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.gen .a { font-size: 12px; opacity: .85; border-top: 1px solid rgba(246,243,234,.45); padding-top: 6px; }
.chip { position: absolute; top: 8px; right: 8px; z-index: 2; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(15,20,17,.72); color: #fff; letter-spacing: .02em; }
.chip.reading { background: #1f5c46; }
.chip.done { background: rgba(15,20,17,.72); }
.chip.want { background: #6b5a2a; }
.chip.paused { background: #6d4e60; }
.sample { position: absolute; left: 12px; bottom: 8px; z-index: 2; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.85); color: #333; }
.meta { min-width: 0; }
.meta .t { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { color: var(--star); letter-spacing: 1px; font-size: 14px; }
.stars .off { color: var(--line); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { font-family: var(--font-display); color: var(--ink); font-size: 20px; margin: 0; }
.empty p { margin: 0; max-width: 42ch; }

.syncnote { font-size: 12px; color: var(--muted); }

/* Dialog */
dialog { border: 0; padding: 0; border-radius: 14px; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,15,12,.55); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); }
@media (max-width: 600px) {
  dialog { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border-radius: 0; }
  .dlg { height: 100%; max-height: 100%; padding-top: env(safe-area-inset-top, 0px); }
  .dlg-body { padding: 16px; gap: 18px; -webkit-overflow-scrolling: touch; }
  .dlg-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .dlg-foot .btn { padding: 10px 16px; }
  .rate button { font-size: 34px; padding: 4px; }
}
.dlg-body { flex: 1 1 auto; min-height: 0; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.dlg-body { overflow: auto; padding: 20px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
@media (max-width: 600px) { .dlg-body { grid-template-columns: minmax(0, 1fr); } .coverpick { max-width: 130px; margin: 0 auto; width: 100%; } }
.coverpick { display: flex; flex-direction: column; gap: 8px; }
.drop { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 4px 8px 8px 4px; overflow: hidden; border: 2px dashed var(--line); background: var(--paper); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 0; }
.drop.has { border-style: solid; border-color: transparent; box-shadow: var(--shadow); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop img { width: 100%; height: 100%; object-fit: cover; }
.drop .hint { padding: 12px; }
.coverpick .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; align-content: start; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 460px) { .form { grid-template-columns: minmax(0, 1fr); } }
label.l { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.l .field { color: var(--ink); font-size: 16px; }
textarea.field { resize: vertical; min-height: 96px; line-height: 1.6; }
.rate { display: flex; align-items: center; gap: 2px; }
.rate button { background: none; border: 0; font-size: 28px; line-height: 1; padding: 2px; color: var(--line); }
.rate button.on { color: var(--star); }
.rate .lbl { margin-left: 8px; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
.dlg-foot .r { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--danger); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); z-index: 10; }
@media (prefers-reduced-motion: reduce) { .cover { transition: none; } .book:hover .cover { transform: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ชั้นหนังสือของฉัน</h1>
      <p class="sub" id="syncnote">กำลังเปิดชั้นหนังสือ…</p>
    </div>
    <button class="btn primary" id="addBtn" type="button">+ เพิ่มหนังสือ</button>
  </header>

  <section class="stats" aria-label="สรุปการอ่าน">
    <div class="stat"><div class="k" id="yearLbl">อ่านจบปีนี้</div><div class="v"><span id="sDone">0</span> <small>เล่ม</small></div></div>
    <div class="stat"><div class="k">กำลังอ่าน</div><div class="v"><span id="sReading">0</span> <small>เล่ม</small></div></div>
    <div class="stat"><div class="k">คะแนนเฉลี่ย</div><div class="v"><span id="sAvg">–</span> <small>/ 5</small></div></div>
    <div class="stat"><div class="k">หน้าที่อ่านไปแล้ว</div><div class="v"><span id="sPages">0</span> <small>หน้า</small></div></div>
  </section>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="กรองตามสถานะ" id="tabs"></div>
    <div class="grow"><input class="field" id="q" type="search" placeholder="ค้นหาชื่อเรื่อง ผู้เขียน หรือหมวด" aria-label="ค้นหา"></div>
    <select class="field" id="sort" aria-label="เรียงลำดับ">
      <option value="updated">แก้ไขล่าสุด</option>
      <option value="rating">คะแนนสูงสุด</option>
      <option value="title">ชื่อเรื่อง ก–ฮ</option>
      <option value="finished">วันที่อ่านจบ</option>
    </select>
  </div>

  <main id="shelf" class="shelf" aria-live="polite"></main>
  <div id="empty" class="empty" hidden>
    <h2 id="emptyTitle">ชั้นยังว่างอยู่</h2>
    <p id="emptyText">เพิ่มหนังสือเล่มแรก ใส่รูปปก รายละเอียด และให้คะแนนได้เลย</p>
    <button class="btn primary" type="button" id="emptyAdd">+ เพิ่มหนังสือเล่มแรก</button>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="form" method="dialog" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle">เพิ่มหนังสือ</h2>
      <button class="x" type="button" id="closeBtn" aria-label="ปิด">×</button>
    </div>
    <div class="dlg-body">
      <div class="coverpick">
        <button class="drop" type="button" id="drop" aria-label="เลือกรูปปก">
          <span class="hint" id="dropHint">แตะเพื่อเลือกรูปปก<br>หรือลากไฟล์มาวาง</span>
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="row">
          <button class="linkbtn" type="button" id="pickBtn">เปลี่ยนรูป</button>
          <button class="linkbtn" type="button" id="clearImg" hidden>ลบรูป</button>
        </div>
        <div class="err" id="imgErr" hidden></div>
      </div>
      <div class="form">
        <label class="l full">ชื่อเรื่อง *<input class="field" id="fTitle" required maxlength="200"></label>
        <label class="l">ผู้เขียน<input class="field" id="fAuthor" maxlength="200"></label>
        <label class="l">หมวด / แท็ก<input class="field" id="fGenre" maxlength="120" placeholder="เช่น นิยาย, จิตวิทยา"></label>
        <div class="l full">สถานะ
          <div class="seg" id="fStatus" role="group" aria-label="สถานะ"></div>
        </div>
        <label class="l">จำนวนหน้า<input class="field" id="fPages" type="number" min="0" inputmode="numeric"></label>
        <label class="l">อ่านถึงหน้า<input class="field" id="fPage" type="number" min="0" inputmode="numeric"></label>
        <label class="l">เริ่มอ่าน<input class="field" id="fStart" type="date"></label>
        <label class="l">อ่านจบ<input class="field" id="fEnd" type="date"></label>
        <div class="l full">คะแนน
          <div class="rate" id="fRate"></div>
        </div>
        <label class="l full">บันทึก / รีวิว<textarea class="field" id="fNotes" maxlength="8000" placeholder="ชอบอะไร ไม่ชอบอะไร ได้อะไรจากเล่มนี้"></textarea></label>
        <label class="l full">ประโยคที่ชอบ<textarea class="field" id="fQuote" maxlength="2000" style="min-height:64px"></textarea></label>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn danger" type="button" id="delBtn" hidden>ลบเล่มนี้</button>
      <span class="err" id="formErr" hidden></span>
      <div class="r">
        <button class="btn" type="button" id="cancelBtn">ยกเลิก</button>
        <button class="btn primary" type="submit" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const STATUS = [
    { id: "reading", label: "กำลังอ่าน" },
    { id: "want", label: "อยากอ่าน" },
    { id: "done", label: "อ่านจบแล้ว" },
    { id: "paused", label: "พักไว้" },
  ];
  const STATUS_LABEL = Object.fromEntries(STATUS.map(s => [s.id, s.label]));
  const RATE_WORDS = ["ยังไม่ให้คะแนน", "ไม่ชอบ", "พอใช้", "ดี", "ดีมาก", "ต้องอ่าน!"];
  const CLOTH = ["#1f5c46", "#7a2e2e", "#27466e", "#6b5a2a", "#4c3a63", "#2f5f63", "#80522c", "#3b3f45"];
  const $ = id => document.getElementById(id);

  let books = [];
  let filter = "all";
  let editing = null;   // book being edited (null = new)
  let draft = null;     // { image, rating, status }

  // ---------- storage: shared artifact db when available, else this browser (IndexedDB) ----------
  const store = { mode: "pending", save: null, remove: null };
  let markReady; const ready = new Promise(r => (markReady = r));

  function localStore(onChange) {
    let dbp = null;
    try {
      dbp = new Promise((res, rej) => {
        const r = indexedDB.open("reading-shelf", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("books", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { dbp = Promise.reject(e); }
    let mem = [];
    const tx = (mode, fn) => dbp.then(db => new Promise((res, rej) => {
      const t = db.transaction("books", mode); const s = t.objectStore("books");
      const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    }));
    const reload = () => tx("readonly", s => s.getAll()).then(all => { mem = all || []; onChange(mem); })
      .catch(() => onChange(mem));
    reload();
    return {
      mode: "local",
      save: b => tx("readwrite", s => s.put(b)).then(reload).catch(() => { mem = mem.filter(x => x.id !== b.id).concat(b); onChange(mem); }),
      remove: id => tx("readwrite", s => s.delete(id)).then(reload).catch(() => { mem = mem.filter(x => x.id !== id); onChange(mem); }),
    };
  }

  function useLocal(note) {
    Object.assign(store, localStore(setBooks));
    $("syncnote").textContent = note || "บันทึกไว้ในเบราว์เซอร์นี้";
    markReady();
  }

  async function boot() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return useLocal();
    let db = null;
    try { db = await c.use("db"); } catch (e) { db = null; }
    if (!db) return useLocal("บันทึกไว้ในเบราว์เซอร์นี้ (ลงชื่อเข้าใช้เพื่อเก็บไว้ในบัญชี)");
    const col = db.collection("books");
    let first = true;
    col.onSnapshot(snap => {
      setBooks(snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })));
      if (first) { first = false; $("syncnote").textContent = "บันทึกอัตโนมัติ เปิดจากเครื่องไหนก็เห็น"; }
    }, () => { useLocal("เชื่อมต่อที่เก็บข้อมูลไม่ได้ ตอนนี้บันทึกไว้ในเบราว์เซอร์นี้"); });
    Object.assign(store, {
      mode: "db",
      save: b => { const { id, ...body } = b; return col.doc(id).set(body); },
      remove: id => col.doc(id).delete(),
    });
    markReady();
  }

  function setBooks(list) { books = list.slice(); render(); }

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; };
  const clothFor = b => CLOTH[hash(b.title || b.id) % CLOTH.length];
  const starStr = r => `<span class="stars" aria-label="${r} จาก 5 ดาว">${"★".repeat(r)}<span class="off">${"★".repeat(5 - r)}</span></span>`;
  const progress = b => (b.pages > 0 ? Math.min(100, Math.round(((b.status === "done" ? b.pages : (b.page || 0)) / b.pages) * 100)) : 0);
  const newId = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2200); }

  function coverHTML(b) {
    const inner = b.image
      ? `<img src="${esc(b.image)}" alt="ปก ${esc(b.title)}" loading="lazy">`
      : `<div class="gen" style="background:${clothFor(b)}"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author || "ไม่ระบุผู้เขียน")}</div></div>`;
    return `<div class="cover">${inner}<span class="chip ${esc(b.status)}">${esc(STATUS_LABEL[b.status] || "")}</span>${b.example ? '<span class="sample">ตัวอย่าง</span>' : ""}</div>`;
  }

  // ---------- render ----------
  function render() {
    const year = new Date().getFullYear();
    $("yearLbl").textContent = `อ่านจบปี ${year + 543}`;
    const done = books.filter(b => b.status === "done");
    $("sDone").textContent = done.filter(b => (b.finished || "").startsWith(String(year))).length;
    $("sReading").textContent = books.filter(b => b.status === "reading").length;
    const rated = books.filter(b => b.rating > 0);
    $("sAvg").textContent = rated.length ? (rated.reduce((a, b) => a + b.rating, 0) / rated.length).toFixed(1) : "–";
    const pages = books.reduce((a, b) => a + (b.status === "done" ? (+b.pages || 0) : Math.min(+b.page || 0, +b.pages || Infinity)), 0);
    $("sPages").textContent = pages.toLocaleString("th-TH");

    const counts = { all: books.length };
    STATUS.forEach(s => (counts[s.id] = books.filter(b => b.status === s.id).length));
    $("tabs").innerHTML = [{ id: "all", label: "ทั้งหมด" }, ...STATUS].map(s =>
      `<button class="tab" type="button" data-f="${s.id}" aria-pressed="${filter === s.id}">${s.label}<span class="n">${counts[s.id]}</span></button>`).join("");

    const q = $("q").value.trim().toLowerCase();
    let list = books.filter(b => (filter === "all" || b.status === filter) &&
      (!q || [b.title, b.author, b.genre].some(v => String(v || "").toLowerCase().includes(q))));
    const sort = $("sort").value;
    list.sort((a, b) =>
      sort === "rating" ? (b.rating || 0) - (a.rating || 0) || (b.updatedAt || 0) - (a.updatedAt || 0) :
      sort === "title" ? String(a.title).localeCompare(String(b.title), "th") :
      sort === "finished" ? String(b.finished || "").localeCompare(String(a.finished || "")) :
      (b.updatedAt || 0) - (a.updatedAt || 0));

    $("shelf").innerHTML = list.map(b => {
      const p = progress(b);
      return `<button class="book" type="button" data-id="${esc(b.id)}">
        ${coverHTML(b)}
        <div class="meta">
          <div class="t">${esc(b.title)}</div>
          <div class="a">${esc(b.author || "")}</div>
          ${b.status === "reading" && b.pages > 0
            ? `<div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div><div class="pct">หน้า ${b.page || 0} / ${b.pages} · ${p}%</div>`
            : b.rating > 0 ? starStr(b.rating) : ""}
        </div>
      </button>`;
    }).join("");

    const isEmpty = list.length === 0 && store.mode !== "pending";
    $("empty").hidden = !isEmpty;
    if (isEmpty) {
      const none = books.length === 0;
      $("emptyTitle").textContent = none ? "ชั้นยังว่างอยู่" : "ไม่พบหนังสือที่ตรงกัน";
      $("emptyText").textContent = none ? "เพิ่มหนังสือเล่มแรก ใส่รูปปก รายละเอียด และให้คะแนนได้เลย" : "ลองเปลี่ยนคำค้นหาหรือเลือกสถานะอื่น";
      $("emptyAdd").hidden = !none;
    }
  }

  // ---------- dialog ----------
  const dlg = $("dlg");
  function renderStatus() {
    $("fStatus").innerHTML = STATUS.map(s => `<button type="button" data-s="${s.id}" aria-pressed="${draft.status === s.id}">${s.label}</button>`).join("");
  }
  function renderRate() {
    const r = draft.rating;
    $("fRate").innerHTML = [1, 2, 3, 4, 5].map(n =>
      `<button type="button" data-r="${n}" class="${n <= r ? "on" : ""}" aria-label="${n} ดาว" aria-pressed="${n === r}">★</button>`).join("")
      + `<span class="lbl">${RATE_WORDS[r]}</span>`;
  }
  function renderCover() {
    const d = $("drop");
    d.classList.toggle("has", !!draft.image);
    d.innerHTML = draft.image ? `<img src="${esc(draft.image)}" alt="รูปปกที่เลือก">` : `<span class="hint">แตะเพื่อเลือกรูปปก<br>หรือลากไฟล์มาวาง</span>`;
    $("clearImg").hidden = !draft.image;
    $("pickBtn").textContent = draft.image ? "เปลี่ยนรูป" : "เลือกรูป";
  }
  function openEditor(b) {
    editing = b || null;
    draft = { image: b?.image || "", rating: b?.rating || 0, status: b?.status || (b ? "want" : "reading") };
    $("dlgTitle").textContent = b ? "แก้ไขหนังสือ" : "เพิ่มหนังสือ";
    $("fTitle").value = b?.title || "";
    $("fAuthor").value = b?.author || "";
    $("fGenre").value = b?.genre || "";
    $("fPages").value = b?.pages || "";
    $("fPage").value = b?.page || "";
    $("fStart").value = b?.started || "";
    $("fEnd").value = b?.finished || "";
    $("fNotes").value = b?.notes || "";
    $("fQuote").value = b?.quote || "";
    $("delBtn").hidden = !b; $("delBtn").classList.remove("armed"); $("delBtn").textContent = "ลบเล่มนี้";
    $("formErr").hidden = true; $("imgErr").hidden = true;
    renderStatus(); renderRate(); renderCover();
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(() => $("fTitle").focus(), 30);
  }
  function closeEditor() { if (dlg.open) dlg.close(); editing = null; }

  // Shrink a photo to a cover-sized JPEG so it fits comfortably in storage.
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
      img.src = url;
    });
  }
  async function compress(file) {
    const img = await loadImage(file);
    let maxW = 600, quality = 0.82, out = "";
    for (let i = 0; i < 6; i++) {
      const scale = Math.min(1, maxW / img.naturalWidth, (maxW * 1.6) / img.naturalHeight);
      const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      out = c.toDataURL("image/jpeg", quality);
      if (out.length < 170000) break;
      maxW = Math.round(maxW * 0.8); quality = Math.max(0.6, quality - 0.06);
    }
    return out;
  }
  async function takeFile(file) {
    $("imgErr").hidden = true;
    if (!file || !/^image\//.test(file.type)) { $("imgErr").textContent = "ไฟล์นี้ไม่ใช่รูปภาพ ลองเลือกไฟล์ JPG หรือ PNG"; $("imgErr").hidden = false; return; }
    try { draft.image = await compress(file); renderCover(); }
    catch (e) { $("imgErr").textContent = "เปิดรูปนี้ไม่ได้ ลองใช้รูปอื่น"; $("imgErr").hidden = false; }
  }

  async function save(e) {
    e.preventDefault();
    const title = $("fTitle").value.trim();
    if (!title) { $("formErr").textContent = "ใส่ชื่อเรื่องก่อนบันทึก"; $("formErr").hidden = false; $("fTitle").focus(); return; }
    const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : 0; };
    const now = Date.now();
    let finished = $("fEnd").value;
    if (draft.status === "done" && !finished) finished = new Date(now - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const b = {
      id: editing?.id || newId(),
      title, author: $("fAuthor").value.trim(), genre: $("fGenre").value.trim(),
      status: draft.status, rating: draft.rating, image: draft.image || "",
      pages: num($("fPages").value), page: num($("fPage").value),
      started: $("fStart").value, finished,
      notes: $("fNotes").value, quote: $("fQuote").value,
      createdAt: editing?.createdAt || now, updatedAt: now,
    };
    $("saveBtn").disabled = true;
    try {
      await ready; await store.save(b);
      closeEditor(); toast(editing ? "บันทึกแล้ว" : "เพิ่มลงชั้นแล้ว");
    } catch (err) {
      const code = err && err.code;
      $("formErr").textContent = code === "not_granted" ? "บัญชีนี้ดูได้อย่างเดียว แก้ไขไม่ได้"
        : code === "quota_exceeded" ? "ที่เก็บข้อมูลเต็ม ลองลบรูปปกบางเล่มออก"
        : "บันทึกไม่สำเร็จ ลองอีกครั้ง" + (code ? ` (${code})` : "");
      $("formErr").hidden = false;
    } finally { $("saveBtn").disabled = false; }
  }

  // ---------- events ----------
  $("addBtn").onclick = () => openEditor(null);
  $("emptyAdd").onclick = () => openEditor(null);
  $("tabs").onclick = e => { const t = e.target.closest("[data-f]"); if (t) { filter = t.dataset.f; render(); } };
  $("q").oninput = render;
  $("sort").onchange = render;
  $("shelf").onclick = e => { const el = e.target.closest("[data-id]"); if (el) openEditor(books.find(b => b.id === el.dataset.id)); };
  $("fStatus").onclick = e => { const t = e.target.closest("[data-s]"); if (!t) return; draft.status = t.dataset.s; renderStatus(); };
  $("fRate").onclick = e => { const t = e.target.closest("[data-r]"); if (!t) return; const n = +t.dataset.r; draft.rating = draft.rating === n ? 0 : n; renderRate(); };
  $("drop").onclick = () => $("file").click();
  $("pickBtn").onclick = () => $("file").click();
  $("clearImg").onclick = () => { draft.image = ""; renderCover(); };
  $("file").onchange = e => { takeFile(e.target.files[0]); e.target.value = ""; };
  const drop = $("drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); takeFile(e.dataTransfer.files[0]); });
  dlg.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(f => /^image\//.test(f.type)); if (f) { e.preventDefault(); takeFile(f); } });
  $("form").addEventListener("submit", save);
  $("cancelBtn").onclick = closeEditor;
  $("closeBtn").onclick = closeEditor;
  dlg.addEventListener("click", e => { if (e.target === dlg) closeEditor(); });
  $("delBtn").onclick = async () => {
    const btn = $("delBtn");
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "กดอีกครั้งเพื่อยืนยันการลบ"; return; }
    try { await ready; await store.remove(editing.id); closeEditor(); toast("ลบแล้ว"); }
    catch (e) { $("formErr").textContent = "ลบไม่สำเร็จ ลองอีกครั้ง"; $("formErr").hidden = false; }
  };

  render();
  boot();
})();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
